---
name: CI

"on":
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        # yamllint disable-line rule:line-length rule:comments
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3
        with:
          python-version: ${{ matrix.python-version }}

      - name: Sync dependencies
        run: uv sync --group dev --group ta

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Type check (pyright)
        run: uv run pyright

      - name: Dead code check (vulture)
        run: uv run vulture

      - name: Run tests
        run: uv run pytest

  wheel-install:
    # pip ignores uv-only configuration, so prove a plain pip install of the
    # built wheel resolves the right dependencies and starts.
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - name: Install uv
        # yamllint disable-line rule:line-length rule:comments
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2  # v10.3.3

      - name: Build wheel
        run: uv build --wheel --out-dir dist

      - name: Install the wheel with pip into a clean venv
        run: |
          python3 -m venv /tmp/wheel-venv
          wheel="$(ls dist/*.whl)"
          /tmp/wheel-venv/bin/pip install "schwab-mcp[ta,signal] @ file://$PWD/$wheel"
          /tmp/wheel-venv/bin/schwab-mcp --help
          /tmp/wheel-venv/bin/python -I -c "import schwab_mcp.auth, pandas_ta_classic, websockets"
