---
name: AI Agent

"on":
  workflow_dispatch:
    inputs:
      prompt:
        description: Custom prompt to run
        required: false
        type: string
      issue_number:
        description: Issue/PR number to comment on
        required: false
        type: number

  issue_comment:
    types: [created]

  pull_request:
    types: [review_requested]

  pull_request_target:
    types: [labeled]

  pull_request_review:
    types: [submitted]

  pull_request_review_comment:
    types: [created]

jobs:
  agent:
    # yamllint disable rule:line-length
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'issue_comment' &&
       contains(github.event.comment.body, '@dobbyphus') &&
       github.event.comment.user.login != 'dobbyphus[bot]' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association)) ||
      (github.event_name == 'pull_request' &&
       github.event.requested_reviewer.login == 'dobbyphus[bot]') ||
      (github.event_name == 'pull_request_review' &&
       github.event.review.user.login != 'dobbyphus[bot]' &&
       contains(github.event.review.body, '@dobbyphus')) ||
      (github.event_name == 'pull_request_review_comment' &&
       contains(github.event.comment.body, '@dobbyphus') &&
       github.event.comment.user.login != 'dobbyphus[bot]' &&
       contains(fromJSON('["OWNER", "MEMBER", "COLLABORATOR"]'), github.event.comment.author_association))
    # yamllint enable rule:line-length
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write

    steps:
      - name: Generate App Token
        id: app-token
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}

      - name: Checkout
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # github.head_ref: PR events (pull_request, pull_request_target)
          # github.event.pull_request.head.ref: PR review/comment events
          # github.ref: fallback for other events
          # yamllint disable-line rule:line-length
          ref: ${{ github.head_ref || github.event.pull_request.head.ref || github.ref }}
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup uv
        # yamllint disable-line rule:line-length rule:comments
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7  # v10.2.0

      - name: Setup ruff
        # yamllint disable-line rule:line-length rule:comments
        uses: astral-sh/ruff-action@278981a28ce3188b1e39527901f38254bf3aac89  # v4.1.0

      - name: Run Agent
        uses: dobbyphus/action@main
        with:
          bot_name: dobbyphus
          auth_json: ${{ secrets.COPILOT_AUTH_JSON }}
          provider_anthropic: "no"
          provider_openai: "no"
          provider_google: "no"
          provider_copilot: "yes"
          github_token: ${{ steps.app-token.outputs.token }}

  label-review:
    if: >-
      github.event_name == 'pull_request_target' &&
      github.event.action == 'labeled' &&
      github.event.label.name == 'ai-review' &&
      github.event.pull_request.state == 'open' &&
      github.event.sender &&
      github.event.sender.type == 'User' &&
      github.event.sender.login
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check labeler's repository permission
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/github-script@ed597411d8f924073f98dfc5c65a23a2325f34cd  # v8
        with:
          script: |
            const { data } =
              await github.rest.repos.getCollaboratorPermissionLevel({
                ...context.repo,
                username: context.payload.sender.login,
              });
            if (!['write', 'admin'].includes(data.permission)) {
              core.setFailed(
                'The labeler needs write, maintain, or admin access.'
              );
            }

      # Keep agent configuration trusted; inspect PR changes via gh pr diff.
      - name: Checkout trusted workflow revision
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 0

      - name: Generate review-only App Token
        id: app-token
        # yamllint disable-line rule:line-length rule:comments
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1  # v3
        with:
          app-id: ${{ secrets.APP_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: read
          permission-issues: write
          permission-pull-requests: write

      - name: Review labeled PR
        # Reviewed upstream revision supporting privileged label events.
        # yamllint disable-line rule:line-length rule:comments
        uses: dobbyphus/action@b44f34eea14e5bdcac7e3f89e04f757547274550
        with:
          bot_name: dobbyphus
          bot_login: dobbyphus[bot]
          mode: review
          prompt_path: ${{ github.workspace }}/.github/prompts
          auth_json: ${{ secrets.COPILOT_AUTH_JSON }}
          provider_anthropic: "no"
          provider_openai: "no"
          provider_google: "no"
          provider_copilot: "yes"
          github_token: ${{ steps.app-token.outputs.token }}
